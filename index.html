<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيادة النور الطبية</title>
    <style>
        :root { --bg: #0a0a0a; --text: #ffffff; --card: #1a1a1a; --primary: #18acec; --input-bg: #2a2a2a; }
        .light-mode { --bg: #f4f4f4; --text: #333333; --card: #ffffff; --primary: #158295; --input-bg: #e0e0e0; }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.4s; margin: 0; padding-bottom: 120px; }
        .container { max-width: 500px; margin: auto; padding: 20px; }

        .theme-btn { background: rgba(37, 156, 211, 0.2); padding: 10px 20px; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: bold; border: 1px solid var(--primary); margin-bottom: 15px; }

        .section { display: none; }
        .active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: var(--card); padding: 25px; border-radius: 30px; border: 1px solid rgba(37, 164, 211, 0.2); margin-top: 10px; text-align: center; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #aaa; background-color: var(--input-bg); color: var(--text); box-sizing: border-box; }
        
        .btn-submit { background: rgba(26, 144, 212, 0.2); color: var(--primary); border: 2px solid var(--primary); padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: var(--primary); color: white; }
        
        .bottom-nav { position: fixed; bottom: 30px; left: 15px; right: 15px; background: rgba(37, 130, 211, 0.15); backdrop-filter: blur(15px); padding: 10px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--primary); }
        .nav-item { cursor: pointer; padding: 10px 20px; border-radius: 30px; color: var(--text); font-weight: 600; transition: 0.3s; }
        /* التعديل هنا لزيادة الشفافية في الزر النشط */
.nav-item.active { 
    background: rgba(37, 147, 211, 0.3); /* شفافية أكبر (0.3) */
    border: 1px solid var(--primary); /* إضافة إطار أخضر ليبقى الزر واضحاً */
    color: white; 
    box-shadow: 0 4px 15px rgba(37, 121, 211, 0.423); 
}
        
        .footer { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 11px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span> <span id="theme-text">الوضع الليلي</span>
    </div>

    <div id="home" class="section active">
        <div class="card">
            <img src="m.jpg" style="width:120px; height:120px; border-radius:50%; border:3px solid var(--primary);">
            <h2>عيادة النور الطبية</h2>
            <p id="clinic-status" style="font-weight:bold;"></p>
            <p>نخبة من الأطباء لتقديم أفضل رعاية طبية تجميلية بأساليب حديثة.</p>
        </div>
    </div>

    <div id="booking" class="section">
        <div class="card">
            <h3>بيانات الحجز</h3>
            <input type="text" id="name" placeholder="الاسم الثلاثي">
            <input type="number" id="age" placeholder="العمر">
            <input type="text" id="city" placeholder="المحافظة">
            <input type="tel" id="phone" placeholder="رقم الهاتف">
            <input type="tel" id="whatsapp" placeholder="رقم الواتساب">
            <select id="type">
                <option value="قلع سن">قلع سن</option>
                <option value="زراعة اسنان">زراعة اسنان</option>
            </select>
            <div style="text-align: right; margin: 10px 0;">
                <label>طريقة التواصل:</label><br>
                <input type="radio" name="contact-method" value="whatsapp" checked> واتساب
                <input type="radio" name="contact-method" value="telegram"> تليجرام
                <input type="radio" name="contact-method" value="phone"> هاتف
            </div>
            <button class="btn-submit" onclick="handleBookingSubmit()">إرسال الحجز</button>
        </div>
    </div>

    <div id="contact" class="section">
        <div class="card">
            <h3>موقعنا</h3>
            <p>📍 بغداد، الكرادة، شارع 16</p>
            <img src="map.jpg" alt="خريطة الموقع" style="width:100%; border-radius:15px; margin-top:10px;">
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="showSection('home', this)">🏠 الرئيسية</div>
    <div class="nav-item" onclick="showSection('booking', this)">📅 حجز</div>
    <div class="nav-item" onclick="showSection('contact', this)">📍 الموقع</div>
</div>

<div class="footer">جميع الحقوق محفوظة 2026</div>

<script>
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        body.classList.toggle('light-mode');
        icon.innerText = body.classList.contains('light-mode') ? "☀️" : "🌙";
        text.innerText = body.classList.contains('light-mode') ? "الوضع النهاري" : "الوضع الليلي";
    }

    function showSection(id, element) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        element.classList.add('active');
    }

    function handleBookingSubmit() {
        let name = document.getElementById('name').value;
        let age = document.getElementById('age').value;
        let city = document.getElementById('city').value;
        let phone = document.getElementById('phone').value;
        let whatsapp = document.getElementById('whatsapp').value;
        let type = document.getElementById('type').value;
        let method = document.querySelector('input[name="contact-method"]:checked').value;
        
        let message = `👋 *حجز جديد:* %0A👤 *الاسم:* ${name} %0A🎂 *العمر:* ${age} %0A📍 *المحافظة:* ${city} %0A🛠 *الخدمة:* ${type} %0A📞 *هاتف:* ${phone} %0A💬 *واتساب:* ${whatsapp}`;
        
        if (method === "whatsapp") window.open("https://wa.me/9647859176005?text=" + message, '_blank');
        else if (method === "telegram") window.open("https://t.me/Ali2023yr18?text=" + encodeURIComponent(message.replace(/%0A/g, '\n')), '_blank');
        else window.location.href = "tel:9647859176005";
    }

    const hrs = new Date().getHours();
    document.getElementById('clinic-status').innerHTML = (hrs >= 21 || hrs < 2) ? "🔴 مغلق حالياً" : "🟢 مفتوح الآن";
</script>
</body>
</html>
