<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عيادتنا الطبية</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; text-align: center; }
        .container { max-width: 450px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #008080; }
        .btn-group { display: flex; gap: 10px; margin: 20px 0; }
        button { flex: 1; padding: 12px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .btn-booking { background: #008080; }
        .btn-inquiry { background: #333; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .send-btn { background: #25d366; width: 100%; font-size: 18px; margin-top: 15px; }
        .radio-group { display: flex; justify-content: center; gap: 15px; margin: 10px 0; }
        .map-box { margin-top: 30px; border-radius: 20px; overflow: hidden; }
    </style>
</head>
<body>

<div class="container">
    <img src="m.jpg" alt="عيادة" class="profile-img">
    <div id="clinic-status" style="font-weight: bold; margin-top: 10px;"></div>
    
    <h1>عيادتنا الطبية</h1>
    
    <div class="btn-group">
        <button class="btn-booking" onclick="openTab('booking')">حجز موعد</button>
        <button class="btn-inquiry" onclick="openTab('inquiry')">استفسار</button>
    </div>

    <div id="booking" class="form-section">
        <form onsubmit="handleBookingSubmit(event)">
            <h3>بيانات الحجز</h3>
            <input type="text" id="name" required placeholder="الاسم الثلاثي">
            <input type="number" id="age" required placeholder="العمر">
            <input type="text" id="city" required placeholder="المحافظة">
            <input type="tel" id="phone" required placeholder="رقم الهاتف">
            <input type="tel" id="whatsapp" required placeholder="رقم الواتساب">
            <select id="type" required>
                <option value="قلع سن">قلع سن</option>
                <option value="زراعة اسنان">زراعة اسنان</option>
                <option value="حشوة اسنان">حشوة اسنان</option>
                <option value="جلسة ليزر">جلسة ليزر</option>
                <option value="عملية تجميل">عملية تجميل</option>
                <option value="فلر">فلر</option>
            </select>
<div style="text-align: right; margin: 15px 0;">
    <label style="display: block; margin-bottom: 8px; font-weight: bold;">طريقة التواصل المفضلة:</label>
    
    <div style="display: flex; gap: 15px; justify-content: center;">
        <label><input type="radio" name="contact-method" value="whatsapp" checked> واتساب</label>
        <label><input type="radio" name="contact-method" value="telegram"> تليجرام</label>
        <label><input type="radio" name="contact-method" value="phone"> هاتف</label>
    </div>
</div>
            <button type="submit" class="send-btn">إرسال الحجز</button>
        </form>
    </div>

    <div id="inquiry" class="form-section" style="display:none;">
        <form onsubmit="handleInquirySubmit(event)">
            <h3>اكتب استفسارك</h3>
            <textarea id="msg" required rows="4"></textarea>
            <button type="submit" class="send-btn">إرسال الاستفسار</button>
        </form>
    </div>

    <!-- مربع الخريطة -->
    <div class="map-box">
        <h3>موقع العيادة</h3>
        <iframe src="https://www.google.com/maps/embed?pb=..." width="100%" height="200" frameborder="0" style="border:0;" allowfullscreen></iframe>
    </div>
</div>

<script>
    // حالة العيادة
    const now = new Date();
    const isWorking = (now.getHours() >= 21 || now.getHours() < 2);
    document.getElementById('clinic-status').innerText = isWorking ? "🟢 مفتوح الآن" : "🔴 مغلق حالياً";

    function openTab(tabId) {
        document.getElementById('booking').style.display = (tabId === 'booking') ? 'block' : 'none';
        document.getElementById('inquiry').style.display = (tabId === 'inquiry') ? 'block' : 'none';
    }

function handleBookingSubmit(event) {
    event.preventDefault();

    // جلب البيانات من المدخلات
    let name = document.getElementById('name').value;
    let age = document.getElementById('age').value;
    let city = document.getElementById('city').value;
    let phone = document.getElementById('phone').value;
    let whatsapp = document.getElementById('whatsapp').value;
    let type = document.getElementById('type').value;
    
    // جلب قيمة زر الراديو المحدد (تأكد أن الـ name في HTML هو contact-method)
    let method = document.querySelector('input[name="contact-method"]:checked').value;

    // صياغة الرسالة (نص عادي)
let message = "👋 *مرحباً، أود حجز موعد طبي:* %0A%0A" +
                  "📌 *نوع الخدمة:* " + type + " %0A" +
                  "👤 *اسم المريض:* " + name + " %0A" +
                  "🎂 *العمر:* " + age + " %0A" +
                  "📍 *المحافظة:* " + city + " %0A" +
                  "📞 *رقم الهاتف:* " + phone + " %0A" +
                  "💬 *رقم الواتساب:* " + whatsapp;

    // توجيه المستخدم حسب اختياره
    if (method === "whatsapp") {
        window.open("https://wa.me/9647859176005?text=" + message, '_blank');
    } 
    else if (method === "telegram") {
        // استبدل AliThamer_IQ بالمعرف الخاص بك
        window.open("https://t.me/Ali2023yr18?text=" + encodeURIComponent(message.replace(/%0A/g, '\n')), '_blank');
    } 
    else if (method === "phone") {
        // فتح تطبيق الاتصال مباشرة
        window.location.href = "tel:9647859176005";
    }
}

    function handleInquirySubmit(event) {
        event.preventDefault();
        let msg = document.getElementById('msg').value;
        window.open(`https://wa.me/9647859176005?text=استفسار: ${msg}`, '_blank');
    }
</script>

</body>
</html>
